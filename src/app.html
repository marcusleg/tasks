<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#f5f3f0" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121310" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Tasks" />
		<meta name="text-scale" content="scale" />
		<script>
			// Keep in sync with src/lib/theme.ts. Runs before first paint so there is no flash.
			(function () {
				var pref = 'system';
				try {
					var stored = localStorage.getItem('theme');
					if (stored === 'light' || stored === 'dark') pref = stored;
				} catch (e) {}
				var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.dataset.theme =
					pref === 'system' ? (dark ? 'dark' : 'light') : pref;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
